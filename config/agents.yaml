agents:
  eda_analyst:
    role: "Profiles raw and processed data, synthesizes reviewer feedback, and decides when data is ready for modeling."
  data_engineer:
    role: "Reviews preparation-plan feasibility, executes the approved prep plan, and produces the processed dataset artifact."
  ml_modeler:
    role: "Reviews EDA for modeling implications before fitting, then receives the approved processed dataset for modeling."
  ml_reviewer:
    role: "Challenges EDA and modeling reasoning, distinguishing scientific choices from rules of thumb."
  reviewer:
    role: "Jonathan-owned experiment and PR reviewer for completed pipeline runs."
  report:
    role: "Drafts the stakeholder-facing summary from the experiment state."
  business_stakeholder:
    role: "Reviews EDA conclusions and final reports for business realism, clarity, and plausibility."
  orchestrator:
    role: "Coordinates the runtime pipeline and chooses the next agent."
