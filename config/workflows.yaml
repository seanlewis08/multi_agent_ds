workflows:
  full_pipeline:
    description: "EDA to stakeholder-approved report pipeline."
    steps:
      - eda_raw
      - ml_modeler_raw_review
      - ml_reviewer_raw_review
      - business_stakeholder_raw_review
      - eda_prep_plan
      - data_engineer_feedback
      - data_engineer_execute
      - eda_processed
      - ml_modeler_processed_review
      - ml_reviewer_processed_review
      - business_stakeholder_processed_review
      - eda_processed_approval
      - ml_modeler_handoff
    review_loops:
      eda_preparation:
        revise_preparation: eda_prep_plan
        approve_processed_data: ml_modeler_handoff
  eda_preparation:
    description: "Pre-modeling EDA review, preparation loop, and processed-data approval."
    max_iterations: 3
    processed_artifacts:
      path_key: processed
      filename_pattern: "{source_stem}_processed_{timestamp}.parquet"
    reviewers:
      - ml_modeler
      - ml_reviewer
      - business_stakeholder
  modeling:
    description: "ML modeler + ML reviewer phased loop with per-phase revision cap."
    max_iterations: 3
    review_phases:
      - baseline
      - tune
      - adjust_lr
      - feature_selection
      - final_recommendation
