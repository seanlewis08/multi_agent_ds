workflows:
  full_pipeline:
    description: "EDA to stakeholder-approved report pipeline."
    entry_node: eda_raw
    steps:
      - eda_raw
      - ml_modeler_raw_review
      - ml_reviewer_raw_review
      - business_stakeholder_raw_review
      - eda_prep_plan
      - data_engineer_feedback
      - data_engineer_execute
      - eda_processed
      - ml_modeler_processed_review
      - ml_reviewer_processed_review
      - business_stakeholder_processed_review
      - eda_processed_approval
      - ml_modeler_handoff
    post_model_sequence:
      - evaluation
      - reviewer
      - report
      - business_stakeholder_report_review
    review_loops:
      eda_preparation:
        revise_preparation: eda_prep_plan
        approve_processed_data: ml_modeler_handoff
  baseline_only:
    description: "Synthetic-data shortcut into the existing modeling handoff."
    entry_node: ml_modeler_handoff
    steps:
      - ml_modeler_handoff
    post_model_sequence:
      - evaluation
      - reviewer
      - report
      - business_stakeholder_report_review
  eda_preparation:
    description: "Pre-modeling EDA review, preparation loop, and processed-data approval."
    max_iterations: 3
    processed_artifacts:
      path_key: processed
      filename_pattern: "{source_stem}_processed_{timestamp}.parquet"
    reviewers:
      - ml_modeler
      - ml_reviewer
      - business_stakeholder
  modeling:
    description: "ML modeler + ML reviewer phased loop with per-phase revision cap."
    max_iterations: 3
    review_phases:
      - baseline
      - tune
      - adjust_lr
      - feature_selection
      - final_recommendation
  report:
    description: "Report writer + business stakeholder revision loop."
    max_iterations: 2
    sinks:
      accept: end
      revise_report: report_writer
      revise_modeling: ml_modeler_baseline
