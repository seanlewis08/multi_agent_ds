# Runtime settings placeholder.
# ====================================================================================
# Multi-Agent DS Pipeline Settings
# ====================================================================================
# This is the central configuation file. Change values here and the entire
# pipeline adjusts.

# --------------------------------------------------------------
# Data Generation
# --------------------------------------------------------------
data:
  # source: {synthetic, existing}
  source: synthetic

  # --- Use when source: existing ---
  existing:
    uri: s3://root-dw-data-transfer/multi_agent_ds/data/raw/synthetic_dataset.parquet
    format: parquet
    target_column: binary_target

  # --- Use when source: synthetic ---
  synthetic:
    scale: large

    scales:
        small:
          n_rows: 5000
        medium:
            n_rows: 50000
        large:
            n_rows: 500000

    # target_mode: {learned, deterministic}
    #   learned       — SDV generates the target column (default)
    #   deterministic — SDV generates features; ground truth function creates target
    target_mode: deterministic

    target:
      column_name: binary_target
      positive_rate: 0.27

    random_state: 42

    features:
      # --- Numeric Continuous ---
      age:
        type: numerical
        subtype: float
        min: 16.0
        max: 85.0

      annual_income:
        type: numerical
        subtype: float
        min: 15000.0
        max: 250000.0

      credit_score:
        type: numerical
        subtype: float
        min: 300.0
        max: 850.0

      vehicle_value:
        type: numerical
        subtype: float
        min: 2000.0
        max: 80000.0

      annual_premium:
        type: numerical
        subtype: float
        min: 400.0
        max: 8000.0

      claim_amount_avg:
        type: numerical
        subtype: float
        min: 0.0
        max: 50000.0

      miles_driven_annual:
        type: numerical
        subtype: float
        min: 1000.0
        max: 50000.0

      distance_to_work:
        type: numerical
        subtype: float
        min: 0.5
        max: 80.0

      # --- Numeric Discrete ---
      num_prior_claims:
        type: numerical
        subtype: integer
        min: 0
        max: 12

      policy_tenure_months:
        type: numerical
        subtype: integer
        min: 1
        max: 240

      num_vehicles:
        type: numerical
        subtype: integer
        min: 1
        max: 6

      num_drivers_on_policy:
        type: numerical
        subtype: integer
        min: 1
        max: 5

      # --- Categorical ---
      state:
        type: categorical
        values: [OH, CA, TX, FL, NY, IL, PA, GA, NC, MI]

      vehicle_type:
        type: categorical
        values: [sedan, suv, truck, coupe, van, hatchback]

      coverage_tier:
        type: categorical
        values: [liability_only, basic, standard, premium]

      marital_status:
        type: categorical
        values: [single, married, divorced, widowed]

      education_level:
        type: categorical
        values: [high_school, associates, bachelors, masters, doctorate]


  test_size: 0.2

# -----------------------------------------------------------------------------
# S3 Configuration
# -----------------------------------------------------------------------------
s3:
  bucket: root-dw-data-transfer
  prefix: multi_agent_ds
  profile: data-science         # AWS SSO profile name

  # Sub-paths under s3://{bucket}/{prefix}/
  paths:
    raw: data/raw
    processed: data/processed
    models: models
    artifacts: artifacts
    reports: reports

# -----------------------------------------------------------------------------
# Model Configuration
# -----------------------------------------------------------------------------
model:
  problem_type: classification  # classification or regression
  algorithms:
    - lightgbm
    - logistic_regression
  cv_folds: 5
  test_size: 0.2
  primary_metric: ase
  scoring_metrics:
    - ase
    - gini
    - roc_auc      # sklearn scoring string
    - f1
    - precision
    - recall
    - accuracy
  tuning:
    max_trials: 50
    timeout: 36000
    min_improvement: 0.01
    lr_reduction_factor: 0.5

  baseline:
    algorithm: GradientBoostingClassifier
    params:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.1
      random_state: 42

  # Max iterations for the agent improvement loop
  max_iterations: 5

# -----------------------------------------------------------------------------
# MLflow Configuration
# -----------------------------------------------------------------------------
mlflow:
  experiment_name: multi_agent_ds
  tracking_uri: sqlite:///mlruns.db   # SQLite backend (single file, queryable)
  artifact_location: mlruns           # artifacts (serialized models) still go to disk

# -----------------------------------------------------------------------------
# LLM Configuration
# -----------------------------------------------------------------------------
# Two-axis routing: every (agent, task) pair resolves to a (capability, cost)
# entry. capability picks the model family (coding / balanced / reasoning) and
# cost picks the tier (cheap / moderate / expensive). See
# project_planning/LLM_MODEL_ROUTING.md for the design.
llm:
  default_provider: openai

  # (capability, cost) -> model name
  model_matrix:
    coding:    { cheap: gpt-4.1-mini, moderate: gpt-4.1, expensive: gpt-4.1 }
    balanced:  { cheap: gpt-4.1-mini, moderate: gpt-4.1, expensive: gpt-4.1 }
    reasoning: { cheap: o4-mini,      moderate: o3,      expensive: o3 }

  # Per-capability non-model settings. `temperature: null` means "omit the field"
  # (o-series reasoning models reject non-1.0 temperatures).
  capability_settings:
    coding:    { temperature: 0.1,  max_tokens: 4096 }
    balanced:  { temperature: 0.2,  max_tokens: 2048 }
    reasoning: { temperature: null, max_tokens: 8192 }

  # Resolution order:
  #   routes[agent][task] -> routes[agent][default] -> routes[agent] (shorthand)
  #   -> routes.default
  routes:
    default:              { capability: balanced, cost: cheap }
    eda_analyst:          { capability: balanced, cost: cheap }
    ml_reviewer:          { capability: balanced, cost: cheap }
    business_stakeholder: { capability: balanced, cost: cheap }
    report_writer:        { capability: balanced, cost: cheap }

    data_engineer:
      default: { capability: balanced, cost: cheap }
      execute: { capability: coding,   cost: moderate }

    ml_modeler:
      default:                    { capability: balanced,  cost: cheap }
      eda_review:                 { capability: balanced,  cost: cheap }
      baseline_decision:          { capability: balanced,  cost: cheap }
      learning_rate_decision:     { capability: reasoning, cost: cheap }
      feature_selection_decision: { capability: reasoning, cost: cheap }
      tuning_decision:            { capability: reasoning, cost: expensive }
      modeling_verdict:           { capability: reasoning, cost: expensive }
      modeling_handoff:           { capability: balanced,  cost: cheap }

  # Populated at startup from the LLM_COST_OVERRIDE env var (see app.py).
  # When set, forces every route's cost tier to the override value while
  # preserving the route's capability.
  cost_override: null

  # Future providers — uncomment and add the adapter per FUTURE_WORK.md §2.5.
  # anthropic: { model: claude-sonnet-4-20250514 }
  # google:    { model: gemini-2.0-pro }

# -----------------------------------------------------------------------------
# Debug / Observability
# -----------------------------------------------------------------------------
debug:
  langgraph:
    xray: true
    event_stream:
      version: v2
      verbose: true
  langsmith:
    enabled: false
    project: multi_agent_ds_graph_debug
