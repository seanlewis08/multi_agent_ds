[project]
name = "multi-agent-ds"
version = "0.1.0"
authors = [
    { name = "Sean Lewis", email = "sean.lewis@joinroot.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.89",
    "crewai>=1.14.1",
    "grandalf>=0.8",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langgraph>=1.1.6",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "mlflow>=2.19.0",
    "numba>=0.59",
    "numpy>=2.0",
    "openai>=2.31.0",
    "optuna>=4.8.0",
    "pandas<3",
    "pyarrow>=18.0.0",
    "pydantic>=2.11.10",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sdv>=1.32.1",
    "seaborn>=0.13.2",
    "setuptools>=82.0.1",
    "shap>=0.51.0",
    "streamlit>=1.56.0",
    "xgboost>=3.2.0",
]

[project.scripts]
multi-agent-ds = "multi_agent_ds.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]
